spring:
  config:
    import: optional:file:.env.properties  # .env ?? import
  application:
    name: seoul-shoppingmall

  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT}/${MYSQL_DBNAME}?serverTimezone=UTC&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
        highlight_sql: true

  servlet:
    multipart:
      max-file-size: 150MB       # ?? ?? ?? ??
      max-request-size: 300MB    # ?? ?? ?? ??

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: 3600000

server:
  port: ${SERVER_PORT}